{% extends "base.html" %}
{% block content %}
  <h1 style="text-align: center;" >Your Top 5 Most Frequent Topics.</h1>

  <div class="grid">

    <!-- ─── BAR CHART ─── -->
    <div class="chart-card">
      <div id="barChart" class="chart"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <script>

    const COLORS = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de'];
    const baseTextStyle = { color: '#8a8fa8', fontFamily: 'sans-serif' };
    const baseGrid = { left: '3%', right: '4%', bottom: '3%', containLabel: true };

    // Data needs to have this schema when passed to the chart to get it to work
    //   context = {
    //     "categories": ["Jan","Feb","Mar","Apr","May","Jun"],
    //     "data": [120, 200, 150, 80, 210, 190],
    //   }

    // const orderLabels = ["News", "Diaries", "Celebrity Gossip", "Sports", "Relationships"];
    // const orderValues = [26, 24, 7, 7, 6];

    async function loadChartData() {
      try {
        const response = await fetch('/api/topics-summary/');  // Check the address here to make sure it works

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        // Expected response shape: { "categories": [...], "data": [...] }

        renderChart(data.categories, data.series[0].data);

      } catch (error) {
        console.error('Failed to load chart data:', error);
        renderChart(
          ["News", "Diaries", "Celebrity Gossip", "Sports", "Relationships"],
          [26, 24, 7, 7, 6]
        );
      }
    }
    // ABOVE IS FOR TESTING, DELETE WHEN DONE

    function renderChart(labels, values) {
      const barChart = echarts.init(document.getElementById('barChart'));

      barChart.setOption({
        textStyle: baseTextStyle,
        tooltip: { trigger: 'axis' },
        xAxis: {
          type: 'category',
          data: labels,
          name: "Topic Category",
          nameLocation: "middle",
          nameGap: 30,
          axisLine:  { lineStyle: { color: '#2a2d3a' } },
          axisLabel: { color: '#8a8fa8' },
        },
        yAxis: {
          type: 'value',
          splitLine: { lineStyle: { color: '#2a2d3a' } },
          axisLabel:  { color: '#8a8fa8' },
        },
        grid: baseGrid,
        series: [{
          name: 'Percent of Posts on Your Feed',
          type: 'bar',
          data: values,           // <-- dynamic
          itemStyle: {
            color: (params) => COLORS[params.dataIndex % COLORS.length],
            borderRadius: [4, 4, 0, 0],
          },
        }],
      });

      window.addEventListener('resize', () => barChart.resize());
    }

    // Kick it off
    loadChartData();

  </script>
{% endblock %}
