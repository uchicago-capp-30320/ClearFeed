{% extends "base.html" %}
{% block content %}
    <title>Word Cloud (d3-cloud)</title>
    <!--https://github.com/jasondavies/d3-cloud/blob/main/LICENSE-->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            padding: 24px;
            min-height: 100vh;
        }

        .wordcloud-container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 32px;
        }

        .wordcloud-header {
            margin-bottom: 24px;
            border-bottom: 1px solid #e5e5e7;
            padding-bottom: 16px;
        }

        .wordcloud-header h2 {
            font-size: 1.5rem;
            color: #1d1d1f;
            font-weight: 600;
        }

        .wordcloud-header p {
            color: #6e6e73;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        #wordcloud {
            width: 100%;
            height: 500px;
            background: #fafafa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #wordcloud svg {
            max-width: 100%;
            height: auto;
        }

        .word-text {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .word-text:hover {
            opacity: 0.7;
        }

        .tooltip {
            position: absolute;
            background: rgba(29, 29, 31, 0.95);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .tooltip.visible { opacity: 1; }

        .legend {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #6e6e73;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="wordcloud-container">
        <div class="wordcloud-header">
            <h2>Word Frequency Cloud</h2>
            <p>Built with d3-cloud.</p>
        </div>
        <div id="wordcloud"></div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <!-- d3 and d3-cloud from cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.7/d3.layout.cloud.min.js"></script>

    <script>
        const width = 840;
        const height = 480;

        // Color palette
        const color = d3.scaleOrdinal(d3.schemeTableau10);

        function render(data) {
            const seriesName = data.series[0].name;
            const frequencies = data.series[0].data;

            if (!data.word.length || !frequencies.length) {
                document.getElementById("wordcloud").textContent = "No words available yet.";
                return;
            }

            const minFreq = Math.min(...frequencies);
            const maxFreq = Math.max(...frequencies);

            // Square-root scale so a 10x frequency doesn't become a 10x font
            const fontScale = d3.scaleSqrt()
                .domain([minFreq, maxFreq])
                .range([14, 64]);

            // Transform input into the shape d3-cloud expects.
            const words = data.word.map((w, i) => ({
                text: w,
                frequency: frequencies[i],
                size: fontScale(frequencies[i])
            }));

            //Configure the d3-cloud layout
            const layout = d3.layout.cloud()
                .size([width, height])
                .words(words)
                .padding(3)
                .rotate(() => (Math.random() < 0.5 ? 0 : 90))
                .font("sans-serif")
                .fontSize(d => d.size)
                .spiral("archimedean")
                .on("end", placedWords => draw(placedWords, seriesName));

            layout.start();
        }

        //Render callback
        function draw(placedWords, seriesName) {
            const tooltip = document.getElementById('tooltip');

            const svg = d3.select("#wordcloud")
                .append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            // Centering the cluster.
            const g = svg.append("g")
                .attr("transform", `translate(${width / 2}, ${height / 2})`);

            g.selectAll("text")
                .data(placedWords)
                .enter()
                .append("text")
                .attr("class", "word-text")
                .style("font-size", d => `${d.size}px`)
                .style("font-family", "sans-serif")
                .style("font-weight", "600")
                .style("fill", (d, i) => color(i))
                .attr("text-anchor", "middle")
                .attr("transform", d => `translate(${d.x}, ${d.y}) rotate(${d.rotate})`)
                .text(d => d.text)
                .on("mouseenter", function(event, d) {
                    tooltip.textContent = `${d.text}: ${d.frequency} (${seriesName})`;
                    tooltip.classList.add('visible');
                })
                .on("mousemove", function(event) {
                    tooltip.style.left = (event.pageX + 12) + 'px';
                    tooltip.style.top = (event.pageY + 12) + 'px';
                })
                .on("mouseleave", function() {
                    tooltip.classList.remove('visible');
                });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("{% url 'wordcloud_summary' %}");
                if (!response.ok) throw new Error("Unable to load word cloud data.");
                const data = await response.json();
                render(data);
            } catch (error) {
                document.getElementById("wordcloud").textContent = error.message;
            }
        });
    </script>
{% endblock %}
