{% extends "base.html" %}
{% block content %}
    <title>Sentiment Analysis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f6f7f9;
            --panel: #ffffff;
            --border: #e3e6ea;
            --text: #1a1f26;
            --text-dim: #5c6470;
            --red: #d64545;
            --yellow: #d4af0f;
            --green: #2d8a5a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 24px;
            line-height: 1.5;
        }

        .wrap {
            max-width: 820px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .status {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .summary-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px 28px;
            margin-bottom: 20px;
        }

        .summary-text {
            font-size: 15px;
            color: var(--text-dim);
            line-height: 1.7;
        }

        .summary-text .num {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .summary-text .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            margin: 0 2px;
        }

        .tag.positive { background: rgba(45, 138, 90, 0.12);  color: #1f6b43; border: 1px solid rgba(45, 138, 90, 0.35); }
        .tag.negative { background: rgba(214, 69, 69, 0.10);  color: #b8302f; border: 1px solid rgba(214, 69, 69, 0.35); }
        .tag.neutral  { background: rgba(212, 175, 15, 0.14); color: #8a6f0a; border: 1px solid rgba(212, 175, 15, 0.45); }

        .blurb {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
            font-size: 13px;
            color: var(--text-dim);
        }

        .dial-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px 24px;
        }

        .dial-svg {
            display: block;
            width: 100%;
            max-width: 560px;
            height: auto;
            margin: 0 auto;
        }

        .needle {
            transform-origin: 300px 220px;
            transform: rotate(0deg);
            transition: transform 1400ms cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .scale-row {
            display: flex;
            justify-content: space-between;
            max-width: 560px;
            margin: 16px auto 0;
            padding: 0 4px;
            font-size: 11px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }
    </style>
<body>
    <div class="wrap">
        <header>
            <h1>Sentiment Analysis</h1>
        </header>

        <div class="summary-card">
            <div class="summary-text">
                The sentiments of your tweets were
                <span class="num" id="pct-positive">—</span> positive,
                <span class="num" id="pct-negative">—</span> negative, and
                <span class="num" id="pct-neutral">—</span> neutral, so the overall general sentiment was
                <span class="tag" id="overall-label">—</span>.
            </div>
            <div class="blurb" id="blurb">Calculating sentiment profile…</div>
        </div>

        <div class="dial-card">
            <svg class="dial-svg" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" aria-label="Sentiment dial">
                <path d="M 100 220 A 200 200 0 0 1 200 46.41" fill="none" stroke="#e5484d" stroke-width="44"/>
                <path d="M 200 46.41 A 200 200 0 0 1 400 46.41" fill="none" stroke="#f5d90a" stroke-width="44"/>
                <path d="M 400 46.41 A 200 200 0 0 1 500 220" fill="none" stroke="#30a46c" stroke-width="44"/>

                <!-- Inner separator that matches the card background, for clean segment edges -->
                <path d="M 122 220 A 178 178 0 0 1 478 220" fill="none" stroke="#161b22" stroke-width="2"/>

                <!-- Needle group. Starts pointing straight up (0deg = center/neutral). -->
                <g class="needle" id="needle">
                    <polygon points="300,40 290,215 310,215" fill="#0e1116"/>
                    <path d="M 282 220 A 18 18 0 0 0 318 220 Z" fill="#0e1116"/>
                    <circle cx="300" cy="220" r="4" fill="#e6edf3"/>
                </g>
            </svg>
            <div class="scale-row">
                <span>−1.0</span>
                <span>0.0</span>
                <span>+1.0</span>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------------
        // DUMMY DATA — replace with Django context. Two common patterns:
        //
        //   const sentimentData = {{ sentiment_data|safe }};
        const sentimentData = {
            "sentiment_average": [0.42],
            "sentiment": ["Negative", "Neutral", "Positive"],
            "series": [
                {
                    "name": "Percentage of Tweets",
                    "data": [10, 40, 50]
                }
            ]
        };

        function classifyOverall(score) {
            if (score <= -0.33) return { word: "Negative", cls: "negative" };
            if (score >=  0.33) return { word: "Positive", cls: "positive" };
            return { word: "Neutral", cls: "neutral" };
        }

        function blurbFor(cls, score) {
            const s = score.toFixed(2);
            if (cls === "positive") {
                return `A score of ${s} suggests a positive tone — the majority of posts trend toward approval, optimism, or support.`;
            }
            if (cls === "negative") {
                return `A score of ${s} suggests s negative tone — most posts express disapproval, frustration, or concern.`;
            }
            return `A score of ${s} suggests a neutral tone — posts are largely informational or evenly split between approval and dissent.`;
        }

        function render(data) {
            const score = data.sentiment_average[0];
            const [neg, neu, pos] = data.series[0].data;

            document.getElementById("pct-positive").textContent = pos + "%";
            document.getElementById("pct-negative").textContent = neg + "%";
            document.getElementById("pct-neutral").textContent  = neu + "%";

            const overall = classifyOverall(score);
            const labelEl = document.getElementById("overall-label");
            labelEl.textContent = overall.word;
            labelEl.classList.add(overall.cls);
            document.getElementById("blurb").textContent = blurbFor(overall.cls, score);

            const clamped = Math.max(-1, Math.min(1, score));
            const angle = clamped * 90;

            const needle = document.getElementById("needle");
            needle.style.transform = "rotate(0deg)";
            requestAnimationFrame(() => {
                setTimeout(() => {
                    needle.style.transform = `rotate(${angle}deg)`;
                }, 250);
            });
        }

        document.addEventListener("DOMContentLoaded", () => render(sentimentData));
    </script>
{% endblock %}
