{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}

<div class="center-wrapper">
  <div class="center-card">
    <img
      src="{% static 'images/clearfeed-logo.png' %}"
      alt="ClearFeed Logo"
      class="signup-logo"
    >

    <h1>Welcome back</h1>
    <p>Sign in to continue using ClearFeed.</p>

    <form method="POST">
      {% csrf_token %}

      {{ form|crispy }}

      <button type="submit" class="signup-button">
        Sign in
      </button>
    </form>

    <p style="margin-top: 20px; font-size: 14px; color: var(--cf-muted);">
      Don't have an account? <a href="{% url 'signup' %}">Create one</a>
    </p>
  </div>
</div>

{% endblock %}
