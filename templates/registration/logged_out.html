{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
  :root {
    --cf-blue: #009eed;
    --cf-dark: #213847;
    --cf-muted: #5f6f7a;
    --cf-light: #e8f6fd;
  }

  body {
    background: linear-gradient(180deg, #e7f7ff 0%, #ffffff 45%, #e7f7ff 100%);
    font-family: Helvetica, Arial, sans-serif;
    color: var(--cf-dark);
  }

  .logout-wrapper {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .logout-card {
    width: 100%;
    max-width: 500px;
    background: white;
    border: 3px solid var(--cf-dark);
    border-radius: 28px;
    padding: 42px 36px;
    text-align: center;
    box-shadow: 0 10px 0 rgba(33, 56, 71, 0.14);
  }

  .logout-card h1 {
    font-size: 40px;
    margin-bottom: 12px;
    font-weight: 800;
  }

  .logout-card p {
    color: var(--cf-muted);
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .logout-button {
    display: inline-block;
    background: var(--cf-blue);
    color: white;
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 12px;
    border: 2px solid var(--cf-dark);
    font-weight: 800;
    box-shadow: 0 4px 0 rgba(33, 56, 71, 0.18);
  }
</style>

<div class="logout-wrapper">
  <div class="logout-card">
    <h1>You’re logged out</h1>
    <p>You have successfully signed out of ClearFeed.</p>

    <a href="{% url 'login' %}" class="logout-button">
      Sign back in
    </a>
  </div>
</div>

{% endblock content %}
